[mypy]
python_version = 3.9
files = main.py, controllers.py, tuning.py, sim_types.py
disallow_untyped_defs = True
check_untyped_defs = True
warn_unused_ignores = True
ignore_missing_imports = True

# Matplotlib's stubs do not model the dynamically constructed 3D artists used
# by the renderer. Its function signatures remain typed, and rendering behavior
# is covered by the visualization tests.
[mypy-visualization]
ignore_errors = True
